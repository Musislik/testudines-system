---
- name: Provision Proxmox KVM Virtual Machine for Docker
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Check if Docker VM exists
      command: "qm status {{ vm_vmid }}"
      register: qm_status
      failed_when: false
      changed_when: false

    - name: Inspect VM configuration if VM exists
      command: "qm config {{ vm_vmid }}"
      register: qm_config
      failed_when: false
      changed_when: false
      when: qm_status.rc == 0

    - name: Determine if VM is already valid and fully provisioned
      set_fact:
        vm_is_valid: "{{ qm_status.rc == 0 and (qm_config.stdout is defined) and ('scsi0:' in qm_config.stdout) and not (vm_force_recreate | default(false) | bool) }}"

    - name: Stop incomplete or broken VM if running
      command: "qm stop {{ vm_vmid }} --skiplock 1"
      failed_when: false
      changed_when: false
      when:
        - qm_status.rc == 0
        - not vm_is_valid

    - name: Automatically clean up incomplete or broken VM from previous failed run
      command: "qm destroy {{ vm_vmid }} --purge"
      when:
        - qm_status.rc == 0
        - not vm_is_valid

    - name: Detect available Proxmox storage pools for VM disks
      shell: pvesm status -content images | awk 'NR>1 && $3=="active" {print $1}'
      register: detected_storages
      changed_when: false
      when: (not vm_is_valid) and ((proxmox_storage is not defined) or (proxmox_storage == "auto"))

    - name: Select optimal Proxmox storage pool
      set_fact:
        proxmox_storage: >-
          {{
            'local-zfs' if (detected_storages.stdout_lines is defined and 'local-zfs' in detected_storages.stdout_lines) else
            ('local-lvm' if (detected_storages.stdout_lines is defined and 'local-lvm' in detected_storages.stdout_lines) else
            (detected_storages.stdout_lines[0] if (detected_storages.stdout_lines is defined and detected_storages.stdout_lines | length > 0) else 'local'))
          }}
      when: (not vm_is_valid) and ((proxmox_storage is not defined) or (proxmox_storage == "auto"))

    - name: Set effective storage pools for VM disks
      set_fact:
        proxmox_root_storage: "{{ proxmox_root_storage | default(proxmox_storage | default('local-lvm')) }}"
        proxmox_sync_storage: "{{ proxmox_sync_storage | default(proxmox_storage | default('local-zfs')) }}"
        proxmox_nosync_storage: "{{ proxmox_nosync_storage | default(proxmox_storage | default('local-zfs')) }}"
      when: not vm_is_valid

    - name: Detect host default gateway
      shell: ip route show default | awk '{print $3}' | head -n1
      register: detected_gw
      changed_when: false
      when: (vm_gw is not defined) or (vm_gw == "auto")

    - name: Set vm_gw fact
      set_fact:
        vm_gw: "{{ detected_gw.stdout.strip() }}"
      when: (vm_gw is not defined) or (vm_gw == "auto")

    - name: Detect host DNS nameserver
      shell: awk '/^nameserver/ && $2 !~ /^127\./ {print $2; exit}' /etc/resolv.conf
      register: detected_dns
      changed_when: false
      when: (vm_dns is not defined) or (vm_dns == "auto")

    - name: Set vm_dns fact
      set_fact:
        vm_dns: "{{ detected_dns.stdout.strip() if (detected_dns.stdout is defined and detected_dns.stdout.strip() | length > 0) else vm_gw }}"
      when: (vm_dns is not defined) or (vm_dns == "auto")

    - name: Ensure template directory exists
      file:
        path: "{{ debian_cloud_image_path | dirname }}"
        state: directory
        mode: '0755'
      when: not vm_is_valid

    - name: Download Debian 12 Generic Cloud Image if not present
      get_url:
        url: "{{ debian_cloud_image_url }}"
        dest: "{{ debian_cloud_image_path }}"
        mode: '0644'
      when: not vm_is_valid

    - name: Ensure root SSH key exists on Proxmox host
      shell: ssh-keygen -q -t rsa -N "" -f /root/.ssh/id_rsa
      args:
        creates: /root/.ssh/id_rsa
      when: not vm_is_valid

    - name: Detect available host CPU cores
      shell: nproc
      register: host_cores
      changed_when: false

    - name: Determine effective VM cores
      set_fact:
        effective_vm_cores: "{{ [ [ (vm_cores | default(2) | int), (host_cores.stdout | int) ] | min, 1 ] | max }}"

    - name: Detect available host total memory (MB)
      shell: awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo
      register: host_mem_mb
      changed_when: false

    - name: Determine effective VM memory (MB)
      set_fact:
        effective_vm_memory: "{{ [ (vm_memory | default(4096) | int), ((host_mem_mb.stdout | int) * 0.8) | int ] | min }}"

    - name: Create KVM Virtual Machine
      command: >
        qm create {{ vm_vmid }}
        --name {{ vm_name }}
        --memory {{ effective_vm_memory | default(vm_memory) }}
        --cores {{ effective_vm_cores | default(vm_cores) }}
        --cpu host
        --net0 virtio,bridge=vmbr0
        --scsihw virtio-scsi-pci
      when: not vm_is_valid

    - name: Import Cloud Image disk to Proxmox root storage
      command: "qm importdisk {{ vm_vmid }} {{ debian_cloud_image_path }} {{ proxmox_root_storage }}"
      when: not vm_is_valid

    - name: Retrieve imported disk identifier from VM config
      shell: "qm config {{ vm_vmid }} | grep '^unused[0-9]*:' | head -n1 | awk '{print $2}'"
      register: imported_disk_vol
      changed_when: false
      when: not vm_is_valid

    - name: Attach imported root disk as scsi0
      command: "qm set {{ vm_vmid }} --scsi0 {{ imported_disk_vol.stdout.strip() }},discard=on,ssd=1"
      when: not vm_is_valid

    - name: Resize root disk
      command: "qm resize {{ vm_vmid }} scsi0 {{ vm_root_disk_size }}"
      when: not vm_is_valid

    - name: Configure Cloud-Init drive and VM settings
      command: >
        qm set {{ vm_vmid }}
        --ide2 {{ proxmox_root_storage }}:cloudinit
        --boot c --bootdisk scsi0
        --serial0 socket --vga serial0
        --agent enabled=1
        --ciuser {{ vm_user }}
        --cipassword "{{ vm_password }}"
        --sshkeys /root/.ssh/id_rsa.pub
        --ipconfig0 ip={{ vm_ip }}/24,gw={{ vm_gw }}
        --nameserver {{ vm_dns }}
      when: not vm_is_valid

    - name: Attach persistent data-sync disk (scsi1)
      command: "qm set {{ vm_vmid }} --scsi1 {{ proxmox_sync_storage }}:{{ vm_sync_disk_size | regex_replace('[^0-9]', '') }},discard=on,ssd=1"
      when: (not vm_is_valid) or (qm_config.stdout is defined and 'scsi1:' not in qm_config.stdout)

    - name: Attach non-backed-up data-nosync disk (scsi2)
      command: "qm set {{ vm_vmid }} --scsi2 {{ proxmox_nosync_storage }}:{{ vm_nosync_disk_size | regex_replace('[^0-9]', '') }},backup=0,discard=on,ssd=1"
      when: (not vm_is_valid) or (qm_config.stdout is defined and 'scsi2:' not in qm_config.stdout)

    - name: Test if SSH port 22 is currently responsive on VM
      wait_for:
        host: "{{ vm_ip }}"
        port: 22
        state: started
        timeout: 3
      register: ssh_quick_check
      failed_when: false
      when:
        - vm_is_valid
        - "'status: running' in qm_status.stdout"

    - name: Detect if existing VM configuration or network differs from vars
      set_fact:
        vm_config_outdated: >-
          {{
            vm_is_valid and (
              (('ip=' + vm_ip + '/') not in qm_config.stdout) or
              (('gw=' + vm_gw) not in qm_config.stdout) or
              (vm_dns is defined and ('nameserver: ' + vm_dns) not in qm_config.stdout) or
              ('cores: ' + (effective_vm_cores | string)) not in qm_config.stdout or
              ('memory: ' + (effective_vm_memory | string)) not in qm_config.stdout or
              (ssh_quick_check is defined and (ssh_quick_check.failed | default(false)))
            )
          }}

    - name: Update existing VM Cloud-Init and hardware configuration
      command: >
        qm set {{ vm_vmid }}
        --agent enabled=1
        --cores {{ effective_vm_cores }}
        --memory {{ effective_vm_memory }}
        --ciuser {{ vm_user }}
        --cipassword "{{ vm_password }}"
        --sshkeys /root/.ssh/id_rsa.pub
        --ipconfig0 ip={{ vm_ip }}/24,gw={{ vm_gw }}
        --nameserver {{ vm_dns }}
      when:
        - vm_is_valid
        - vm_config_outdated | default(false)

    - name: Clean Cloud-Init state inside VM before restart if guest agent is responsive
      command: "qm guest exec {{ vm_vmid }} -- cloud-init clean"
      failed_when: false
      changed_when: false
      when:
        - vm_is_valid
        - vm_config_outdated | default(false)
        - "'status: running' in qm_status.stdout"

    - name: Stop running VM to apply updated configuration
      command: "qm stop {{ vm_vmid }}"
      when:
        - vm_is_valid
        - vm_config_outdated | default(false)
        - "'status: running' in qm_status.stdout"

    - name: Wait for VM to stop completely
      command: "qm status {{ vm_vmid }}"
      register: qm_stop_check
      until: "'status: stopped' in qm_stop_check.stdout"
      retries: 30
      delay: 2
      changed_when: false
      when:
        - vm_is_valid
        - vm_config_outdated | default(false)
        - "'status: running' in qm_status.stdout"

    - name: Ensure VM is started
      command: "qm start {{ vm_vmid }}"
      when: >
        (not vm_is_valid) or
        (vm_config_outdated | default(false)) or
        (qm_status.stdout is defined and 'status: stopped' in qm_status.stdout)

    - name: Wait for SSH port 22 on VM
      wait_for:
        host: "{{ vm_ip }}"
        port: 22
        state: started
        delay: 5
        timeout: 180

    - name: Add Docker VM to in-memory inventory
      add_host:
        name: "{{ vm_name }}"
        ansible_host: "{{ vm_ip }}"
        ansible_user: "{{ vm_user }}"
        ansible_connection: ssh
        ansible_become_password: "{{ vm_password }}"
        ansible_ssh_private_key_file: /root/.ssh/id_rsa
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        groups: docker_vm

- name: Provision Docker VM (Storage, Docker CE, Tailscale, Stacks)
  hosts: docker_vm
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Wait for Cloud-Init to complete
      command: cloud-init status --wait
      changed_when: false

    - name: Extra settle delay after Cloud-Init
      pause:
        seconds: 15

    - name: Update apt cache and install prerequisites
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - qemu-guest-agent
          - curl
          - rsync
          - git
          - ca-certificates
          - gnupg
          - e2fsprogs
        state: present
      register: apt_install_result
      retries: 5
      delay: 10
      until: apt_install_result is success

    - name: Ensure qemu-guest-agent service is running
      service:
        name: qemu-guest-agent
        state: started
        enabled: yes

    - name: Ensure persistent data-sync disk (scsi1) is formatted with ext4
      shell: |
        set -e
        DEV=""

        # 1. Search by VirtIO SCSI drive-scsi1 ID
        for candidate in /dev/disk/by-id/*drive-scsi1; do
          if [ -b "$candidate" ]; then
            DEV="$candidate"
            break
          fi
        done

        # 2. Fallback: Search by SCSI Target ID via sysfs (scsi1 is target 1)
        if [ -z "$DEV" ]; then
          for dev_dir in /sys/block/sd* /sys/block/vd*; do
            if [ -d "$dev_dir/device" ]; then
              HCTL=$(basename "$(readlink -f "$dev_dir/device")" 2>/dev/null || true)
              TARGET_ID=$(echo "$HCTL" | cut -d':' -f3)
              if [ "$TARGET_ID" = "1" ]; then
                CANDIDATE="/dev/$(basename "$dev_dir")"
                if [ -b "$CANDIDATE" ]; then
                  DEV="$CANDIDATE"
                  break
                fi
              fi
            fi
          done
        fi

        if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
          echo "ERROR: Unable to locate data-sync disk on scsi1 (drive-scsi1 or target 1)!" >&2
          exit 1
        fi

        # Critical safety check: Never touch root OS device
        ROOT_DEV=$(findmnt -n -o SOURCE / | sed -E 's/[0-9]+$//')
        REAL_DEV=$(readlink -f "$DEV" | sed -E 's/[0-9]+$//')
        if [ -n "$ROOT_DEV" ] && [ "$ROOT_DEV" = "$REAL_DEV" ]; then
          echo "CRITICAL SAFETY ERROR: Resolved data-sync device $DEV ($REAL_DEV) is the root OS disk!" >&2
          exit 1
        fi

        if blkid "$DEV" >/dev/null 2>&1; then
          echo "Device $DEV is already formatted"
        else
          echo "Formatting $DEV with ext4 and LABEL=data-sync..."
          umount "$DEV"* 2>/dev/null || true
          swapoff "$DEV"* 2>/dev/null || true
          wipefs -a "$DEV" || true
          mkfs.ext4 -F -L data-sync "$DEV"
        fi
      args:
        executable: /bin/bash

    - name: Find persistent by-id path for data-sync disk (scsi1)
      shell: "ls -1 /dev/disk/by-id/*drive-scsi1 | head -n1"
      register: data_sync_dev
      changed_when: false

    - name: Mount /mnt/data-sync using SCSI ID in /etc/fstab
      mount:
        path: /mnt/data-sync
        src: "{{ data_sync_dev.stdout.strip() }}"
        fstype: ext4
        opts: defaults,discard
        state: mounted

    - name: Ensure non-backed-up data-nosync disk (scsi2) is formatted with ext4
      shell: |
        set -e
        DEV=""

        # 1. Search by VirtIO SCSI drive-scsi2 ID
        for candidate in /dev/disk/by-id/*drive-scsi2; do
          if [ -b "$candidate" ]; then
            DEV="$candidate"
            break
          fi
        done

        # 2. Fallback: Search by SCSI Target ID via sysfs (scsi2 is target 2)
        if [ -z "$DEV" ]; then
          for dev_dir in /sys/block/sd* /sys/block/vd*; do
            if [ -d "$dev_dir/device" ]; then
              HCTL=$(basename "$(readlink -f "$dev_dir/device")" 2>/dev/null || true)
              TARGET_ID=$(echo "$HCTL" | cut -d':' -f3)
              if [ "$TARGET_ID" = "2" ]; then
                CANDIDATE="/dev/$(basename "$dev_dir")"
                if [ -b "$CANDIDATE" ]; then
                  DEV="$CANDIDATE"
                  break
                fi
              fi
            fi
          done
        fi

        if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
          echo "ERROR: Unable to locate data-nosync disk on scsi2 (drive-scsi2 or target 2)!" >&2
          exit 1
        fi

        # Critical safety check: Never touch root OS device
        ROOT_DEV=$(findmnt -n -o SOURCE / | sed -E 's/[0-9]+$//')
        REAL_DEV=$(readlink -f "$DEV" | sed -E 's/[0-9]+$//')
        if [ -n "$ROOT_DEV" ] && [ "$ROOT_DEV" = "$REAL_DEV" ]; then
          echo "CRITICAL SAFETY ERROR: Resolved data-nosync device $DEV ($REAL_DEV) is the root OS disk!" >&2
          exit 1
        fi

        if blkid "$DEV" >/dev/null 2>&1; then
          echo "Device $DEV is already formatted"
        else
          echo "Formatting $DEV with ext4 and LABEL=data-nosync..."
          umount "$DEV"* 2>/dev/null || true
          swapoff "$DEV"* 2>/dev/null || true
          wipefs -a "$DEV" || true
          mkfs.ext4 -F -L data-nosync "$DEV"
        fi
      args:
        executable: /bin/bash

    - name: Find persistent by-id path for data-nosync disk (scsi2)
      shell: "ls -1 /dev/disk/by-id/*drive-scsi2 | head -n1"
      register: data_nosync_dev
      changed_when: false

    - name: Mount /mnt/data-nosync using SCSI ID in /etc/fstab
      mount:
        path: /mnt/data-nosync
        src: "{{ data_nosync_dev.stdout.strip() }}"
        fstype: ext4
        opts: defaults,discard
        state: mounted

    - name: Ensure data subdirectories exist with proper permissions
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ nextcloud_data_dir }}", owner: '33', group: '33', mode: '0750' }
        - { path: "{{ nextcloud_db_dir }}", mode: '0770' }
        - { path: "{{ jdownloader_config_dir }}", mode: '0777' }
        - { path: "{{ minecraft_data_dir }}", mode: '0777' }
        - { path: "{{ openttd_data_dir }}", mode: '0777' }
        - { path: "{{ nextcloud_avdb_dir }}", mode: '0777' }
        - { path: "{{ webclient_config_dir }}", owner: '1000', group: '1000', mode: '0755' }

    - name: Install Docker CE via official script
      shell: curl -fsSL https://get.docker.com -o /tmp/get-docker.sh && sh /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Add vm_user to docker group
      user:
        name: "{{ vm_user }}"
        groups: docker
        append: yes

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Tailscale
      shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Enable IPv4 forwarding for Tailscale subnet router
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-tailscale.conf

    - name: Authenticate Tailscale if auth key provided
      command: "tailscale up --authkey={{ tailscale_auth_key }} --hostname={{ tailscale_hostname }} {{ tailscale_extra_args }}"
      when: tailscale_auth_key | default('') | length > 0

    - name: Wait and retrieve assigned Tailscale IPv4 address
      command: tailscale ip -4
      register: tailscale_ip_cmd
      changed_when: false
      until: tailscale_ip_cmd.rc == 0 and tailscale_ip_cmd.stdout.strip() | length > 0
      retries: 5
      delay: 2
      when: tailscale_auth_key | default('') | length > 0

    - name: Set dynamic Tailscale IP fact
      set_fact:
        tailscale_ip: "{{ tailscale_ip_cmd.stdout.strip() if (tailscale_auth_key | default('') | length > 0) else '127.0.0.1' }}"

    - name: Configure Tailscale Serve for Nextcloud HTTPS (port 443 -> localhost:80)
      command: tailscale serve --yes --bg 80
      when: tailscale_auth_key | default('') | length > 0

    - name: Ensure shared proxy-tier Docker network exists
      shell: docker network inspect proxy-tier >/dev/null 2>&1 || docker network create proxy-tier

    - name: Ensure /opt/stacks and /opt/dockge directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/stacks
        - /opt/dockge

    - name: Clone Stacks repository to /tmp/stacks-repo
      git:
        repo: "{{ stacks_repo_url }}"
        dest: /tmp/stacks-repo
        version: "{{ stacks_repo_version }}"
        force: yes
        accept_hostkey: yes

    - name: Sync application stacks to /opt/stacks
      command: rsync -av --delete --exclude='.env' --exclude='*.env' /tmp/stacks-repo/stacks/ /opt/stacks/

    - name: Inject Nextcloud .env configuration
      copy:
        dest: /opt/stacks/nextcloud-core/.env
        content: |
          MYSQL_ROOT_PASSWORD={{ nextcloud_mysql_root_password }}
          MYSQL_PASSWORD={{ nextcloud_mysql_password }}
          MYSQL_DATABASE={{ nextcloud_mysql_database }}
          MYSQL_USER={{ nextcloud_mysql_user }}
          MYSQL_INNODB_BUFFER_POOL_SIZE={{ nextcloud_mysql_innodb_buffer_pool_size }}
          MYSQL_INNODB_LOG_FILE_SIZE={{ nextcloud_mysql_innodb_log_file_size }}
          MYSQL_INNODB_FLUSH_METHOD={{ nextcloud_mysql_innodb_flush_method }}
          PHP_MEMORY_LIMIT={{ nextcloud_php_memory_limit }}
          PHP_UPLOAD_LIMIT={{ nextcloud_php_upload_limit }}
          NEXTCLOUD_TRUSTED_DOMAINS={{ nextcloud_trusted_domains }} {{ tailscale_domain | default('') }} {{ tailscale_ip }}
          NEXTCLOUD_OVERWRITE_CLI_URL=https://{{ tailscale_domain | default('localhost') }}
          NEXTCLOUD_DATA_DIR={{ nextcloud_data_dir }}
          NEXTCLOUD_DB_DIR={{ nextcloud_db_dir }}
          NEXTCLOUD_AVDB_DIR={{ nextcloud_avdb_dir }}
        mode: '0600'

    - name: Inject Cloudflare Tunnel .env configuration
      copy:
        dest: /opt/stacks/cloudflared/.env
        content: |
          TUNNEL_TOKEN={{ cloudflare_tunnel_token }}
        mode: '0600'

    - name: Inject JDownloader .env configuration
      copy:
        dest: /opt/stacks/jdownloader/.env
        content: |
          WEB_AUTHENTICATION_USERNAME={{ jdownloader_username }}
          WEB_AUTHENTICATION_PASSWORD={{ jdownloader_password }}
          JDOWNLOADER_CONFIG_DIR={{ jdownloader_config_dir }}
          JDOWNLOADER_OUTPUT_DIR={{ jdownloader_output_dir }}
          TAILSCALE_IP={{ tailscale_ip }}
        mode: '0600'

    - name: Inject Minecraft .env configuration
      copy:
        dest: /opt/stacks/minecraft/.env
        content: |
          MOTD="{{ minecraft_motd }}"
          OPS="{{ minecraft_ops }}"
          LEVEL="{{ minecraft_level }}"
          MEMORY="{{ minecraft_memory }}"
          MINECRAFT_DATA_DIR={{ minecraft_data_dir }}
        mode: '0600'

    - name: Inject OpenTTD .env configuration
      copy:
        dest: /opt/stacks/openttd-server/.env
        content: |
          OPENTTD_SERVER_NAME="{{ openttd_server_name }}"
          OPENTTD_DATA_DIR={{ openttd_data_dir }}
        mode: '0600'

    - name: Inject Web-client .env configuration
      copy:
        dest: /opt/stacks/web-client/.env
        content: |
          TAILSCALE_IP={{ tailscale_ip }}
          WEBCLIENT_CONFIG_DIR={{ webclient_config_dir }}
        mode: '0600'

    - name: Ensure Backrest cache directory exists on host SSD
      file:
        path: /var/cache/backrest
        state: directory
        mode: '0755'

    - name: Inject Backrest .env configuration
      copy:
        dest: /opt/stacks/backrest/.env
        content: |
          TAILSCALE_IP={{ tailscale_ip }}
          BACKREST_CONFIG_DIR={{ backrest_config_dir }}
          BACKREST_DATA_DIR={{ backrest_data_dir }}
          RCLONE_CONFIG_GDRIVE_CLIENT_ID='{{ rclone_gdrive_client_id | default("") }}'
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET='{{ rclone_gdrive_client_secret | default("") }}'
          RCLONE_GDRIVE_TOKEN='{{ rclone_gdrive_token | default("") }}'
        mode: '0600'

    - name: Ensure nextcloud database backup directory exists
      file:
        path: /mnt/data-sync/nextcloud-db-backup
        state: directory
        mode: '0750'

    - name: Setup nightly automated Nextcloud MariaDB dump cron (02:50)
      cron:
        name: "Automated Nextcloud DB dump for Backrest"
        minute: "50"
        hour: "2"
        job: 'docker exec db mariadb-dump --single-transaction --quick -u root -p"{{ nextcloud_mysql_root_password }}" {{ nextcloud_mysql_database }} > /mnt/data-sync/nextcloud-db-backup/nextcloud.sql 2>/dev/null'

    - name: Deploy Dockge compose file
      copy:
        dest: /opt/dockge/compose.yaml
        content: "{{ dockge_compose | to_nice_yaml(indent=2) }}"
        mode: '0644'
      vars:
        dockge_compose:
          version: "3.8"
          services:
            dockge:
              image: "louislam/dockge:1"
              restart: "unless-stopped"
              ports: "{{ ['127.0.0.1:5001:5001'] + ([tailscale_ip + ':5001:5001'] if (tailscale_ip != '127.0.0.1') else []) }}"
              volumes:
                - "/var/run/docker.sock:/var/run/docker.sock"
                - "./data:/app/data"
                - "/opt/stacks:/opt/stacks"
              environment:
                - "DOCKGE_STACKS_DIR=/opt/stacks"

    - name: Start Dockge service using Docker Compose
      command: docker compose up -d
      args:
        chdir: /opt/dockge

    - name: Find all active compose stacks
      find:
        paths: /opt/stacks
        file_type: directory
      register: compose_dirs

    - name: Start or update all Docker Compose stacks
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ item.path }}"
      loop: "{{ compose_dirs.files }}"
      register: compose_output
      changed_when: >
        'Started' in compose_output.stdout or
        'Created' in compose_output.stdout or
        'Recreated' in compose_output.stdout or
        'Pulled' in compose_output.stdout
